<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hanzi Lab · Lesson 1</title><meta name="description" content="One word at a time: Chinese vocabulary, stroke order, and writing practice."><script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.1/dist/hanzi-writer.min.js"></script><style>
:root{--ink:#3b2a22;--muted:#806f64;--line:#eaded2;--paper:#fbf5eb;--card:#fffdf9;--clay:#b65432;--pale:#fbe8d7;--gold:#d89a46}*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:radial-gradient(circle at 10% 10%,#fff7df 0,transparent 32%),var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif}button,select{font:inherit}button{cursor:pointer}.kai{font-family:KaiTi,"Kaiti SC",STKaiti,"楷体",serif;font-weight:400}.top{height:62px;background:#fffdf9dd;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(18px,calc((100% - 1040px)/2));gap:15px}.brand{font-size:19px;font-weight:900;letter-spacing:-.04em}.brand span{color:var(--clay)}.lesson{color:var(--muted);font-size:13px}.script{margin-left:auto;display:flex;background:var(--paper);padding:3px;border-radius:10px}.script button{border:0;background:transparent;border-radius:8px;padding:5px 10px;color:var(--muted);font-size:19px}.script button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 5px #3b2a2214}.shell{max-width:1040px;margin:auto;padding:28px 20px 50px}.journey{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;margin-bottom:22px}.page-count{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--clay)}.track{height:6px;background:#eaded2;border-radius:99px;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--clay));width:0;transition:.25s}.jump{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 9px;max-width:210px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 50px #6c422414;overflow:hidden}.study{display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:590px}.content{padding:42px 44px;border-right:1px solid var(--line);display:flex;flex-direction:column}.tag{font-size:11px;color:var(--clay);font-weight:850;letter-spacing:.12em;text-transform:uppercase}.word{font-size:clamp(70px,10vw,116px);line-height:1.05;margin:16px 0 4px}.pinyin{font-size:24px;color:var(--clay);font-weight:750}.meaning{font-size:21px;margin:8px 0 30px}.example-label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}.example{background:var(--pale);border-radius:16px;padding:18px 20px;line-height:1.6}.example .zh{font-size:25px}.example .py{color:var(--clay);font-weight:700}.example .en{color:var(--muted)}.tip{margin-top:auto;padding-top:24px;color:var(--muted);font-size:13px}.tip b{color:var(--ink)}.practice{padding:28px 30px;background:#fffaf3}.practice-title{font-size:12px;font-weight:850;letter-spacing:.1em;text-transform:uppercase}.char-tabs{display:flex;gap:8px;margin:14px 0 12px}.char-tabs button{width:52px;height:46px;border:1px solid var(--line);background:var(--card);border-radius:11px;font-size:26px;color:var(--ink)}.char-tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.canvas{width:328px;height:328px;max-width:100%;margin:auto;position:relative;border:1px solid var(--line);background:linear-gradient(90deg,transparent 49.7%,#eaded2 50%,transparent 50.3%),linear-gradient(transparent 49.7%,#eaded2 50%,transparent 50.3%),#fffdf9}.canvas.loading:after{content:'Loading strokes…';position:absolute;inset:0;display:grid;place-items:center;background:#fffaf3ee;color:var(--muted);font-size:13px}.error{height:100%;display:grid;place-items:center;text-align:center;padding:25px;color:var(--muted);font-size:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:11px;font-weight:800}.btn.primary{background:var(--clay);border-color:var(--clay);color:white}.complete{grid-column:1/-1}.complete.done{background:#667d55;border-color:#667d55;color:white}.navrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-top:18px}.navbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 16px;color:var(--ink);font-weight:800}.navbtn:last-child{justify-self:end}.navbtn:disabled{opacity:.35;cursor:not-allowed}.keys{color:var(--muted);font-size:11px;text-align:center}
@media(max-width:800px){.study{grid-template-columns:1fr}.content{border-right:0;border-bottom:1px solid var(--line);min-height:420px}.practice{padding:24px}.canvas{width:310px;height:310px}.tip{margin-top:25px}}@media(max-width:520px){.top{height:56px;padding:0 14px}.lesson{display:none}.shell{padding:16px 10px 34px}.journey{grid-template-columns:auto 1fr}.jump{grid-column:1/-1;max-width:none;width:100%}.card{border-radius:18px}.content{padding:28px 22px;min-height:390px}.word{font-size:72px}.pinyin{font-size:21px}.meaning{font-size:18px;margin-bottom:23px}.example .zh{font-size:22px}.practice{padding:20px 14px}.canvas{width:288px;height:288px}.navrow{grid-template-columns:1fr 1fr}.keys{display:none}.navbtn{width:100%}.navbtn:last-child{justify-self:stretch}}
</style></head><body><nav class="top"><div class="brand">Hanzi <span>Lab</span></div><div class="lesson">Lesson 1 · Complete vocabulary</div><div class="script"><button id="simp" class="kai on">简</button><button id="trad" class="kai">繁</button></div></nav>
<main class="shell"><div class="journey"><div id="pageCount" class="page-count">WORD 1 OF 66</div><div class="track"><i id="track"></i></div><select id="jump" class="jump" aria-label="Jump to a word"></select></div>
<article class="card"><div class="study"><section class="content"><div class="tag">Vocabulary</div><div id="word" class="word kai">—</div><div id="pinyin" class="pinyin">Loading…</div><div id="meaning" class="meaning"></div><div class="example-label">Useful example</div><div class="example"><div id="exampleZh" class="zh kai"></div><div id="examplePy" class="py"></div><div id="exampleEn" class="en"></div></div><div class="tip"><b>Study tip:</b> Say the word aloud, read the example, then practice each character on the right.</div></section>
<section class="practice"><div class="practice-title">Stroke order & writing</div><div id="tabs" class="char-tabs"></div><div id="canvas" class="canvas"></div><div class="actions"><button id="watch" class="btn">▶ Watch</button><button id="trace" class="btn primary">✎ Trace</button><button id="complete" class="btn complete">✓ Mark this word studied</button></div></section></div></article>
<div class="navrow"><button id="prev" class="navbtn">← Previous</button><div class="keys">Use ← → keys or swipe</div><button id="next" class="navbtn">Next →</button></div></main>
<script src="./lesson01.js"></script><script>
const $=id=>document.getElementById(id),cache=new Map(),studied=JSON.parse(localStorage.getItem('lesson1-studied')||'{}');let entries=[],index=+(localStorage.getItem('lesson1-page')||0),lang=localStorage.getItem('hanzi-script')||'simp',writer=null,generation=0,touchX=0;
const cdns=[c=>`https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0.1/${encodeURIComponent(c)}.json`,c=>`https://unpkg.com/hanzi-writer-data@2.0.1/${encodeURIComponent(c)}.json`];
const form=i=>i[lang]||i.simp,example=i=>i[lang==='simp'?'example_simp':'example_trad'];
async function getData(ch){if(cache.has(ch))return cache.get(ch);const job=(async()=>{let e;for(const url of cdns.map(f=>f(ch))){try{const r=await fetch(url,{cache:'force-cache'});if(!r.ok)throw Error();return await r.json()}catch(x){e=x}}cache.delete(ch);throw e})();cache.set(ch,job);return job}
function show(){if(!entries.length)return;index=Math.max(0,Math.min(index,entries.length-1));const i=entries[index];localStorage.setItem('lesson1-page',index);$('pageCount').textContent=`WORD ${index+1} OF ${entries.length}`;$('track').style.width=`${(index+1)/entries.length*100}%`;$('jump').value=index;$('word').textContent=form(i);$('pinyin').textContent=i.pinyin;$('meaning').textContent=i.english;$('exampleZh').textContent=example(i);$('examplePy').textContent=i.example_pinyin;$('exampleEn').textContent=i.example_english;$('prev').disabled=index===0;$('next').disabled=index===entries.length-1;$('complete').classList.toggle('done',!!studied[i.idx]);$('complete').textContent=studied[i.idx]?'✓ Studied':'✓ Mark this word studied';$('simp').classList.toggle('on',lang==='simp');$('trad').classList.toggle('on',lang==='trad');const chars=[...form(i)];$('tabs').innerHTML=chars.map((c,n)=>`<button class="kai ${n?'':'on'}" data-char="${c}">${c}</button>`).join('');document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');loadWriter(b.dataset.char)});chars.forEach(c=>getData(c).catch(()=>{}));loadWriter(chars[0])}
function loadWriter(ch){const g=++generation,id=`writer-${g}`;$('canvas').classList.add('loading');$('canvas').innerHTML=`<div id="${id}"></div>`;const size=innerWidth<521?286:326;writer=HanziWriter.create(id,ch,{width:size,height:size,padding:18,strokeColor:'#3b2a22',radicalColor:'#b65432',outlineColor:'#e4d7cb',showOutline:true,showCharacter:true,strokeAnimationSpeed:1.7,delayBetweenStrokes:80,charDataLoader:getData,onLoadCharDataSuccess:()=>{if(g===generation)$('canvas').classList.remove('loading')},onLoadCharDataError:()=>{if(g===generation){$('canvas').classList.remove('loading');$('canvas').innerHTML='<div class="error">Stroke data could not load.<br>Please check your connection.</div>'}}})}
function go(delta){const n=index+delta;if(n<0||n>=entries.length)return;index=n;show();scrollTo({top:0,behavior:'smooth'})}
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);$('jump').onchange=e=>{index=+e.target.value;show()};$('watch').onclick=()=>writer&&writer.animateCharacter();$('trace').onclick=()=>writer&&writer.quiz({showHintAfterMisses:1,highlightOnComplete:true});$('complete').onclick=()=>{const id=entries[index].idx;studied[id]=1;localStorage.setItem('lesson1-studied',JSON.stringify(studied));show()};$('simp').onclick=()=>{lang='simp';localStorage.setItem('hanzi-script',lang);show()};$('trad').onclick=()=>{lang='trad';localStorage.setItem('hanzi-script',lang);show()};addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1)});addEventListener('touchstart',e=>touchX=e.changedTouches[0].screenX,{passive:true});addEventListener('touchend',e=>{const d=e.changedTouches[0].screenX-touchX;if(Math.abs(d)>70)go(d>0?-1:1)},{passive:true});
function start(d){entries=d.entries;$('jump').innerHTML=entries.map((i,n)=>`<option value="${n}">${n+1}. ${i.simp} · ${i.pinyin}</option>`).join('');show();const pre=()=>entries.slice(index,index+4).forEach(i=>[...form(i)].forEach(c=>getData(c).catch(()=>{})));'requestIdleCallback'in window?requestIdleCallback(pre,{timeout:1200}):setTimeout(pre,250)}
if(window.LESSON1_DATA)start(window.LESSON1_DATA);else fetch('./lesson01.json').then(r=>r.json()).then(start).catch(()=>$('canvas').innerHTML='<div class="error">Lesson 1 could not load.</div>');
</script></body></html>
